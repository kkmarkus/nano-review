# Pipeline, dos dados brutos ao modelo: `dvc repro` refaz só os estágios cujo código, dado de
# entrada ou parâmetro mudou. O `dvc.lock` (gerado) registra os hashes de tudo o que entrou e saiu
# de cada estágio.
# Rode com o .venv ativado: o `python` dos comandos é o do ambiente.

stages:
  clean:
    cmd: >-
      python -m nano_review.data.clean
      --input data/raw/B2W-Reviews01.csv
      --output data/silver/reviews.parquet
      --metrics reports/metrics/cleaning.json
      --max-repeat ${clean.max_repeat}
    deps:
      - src/nano_review/data/clean.py
      - data/raw/B2W-Reviews01.csv
    params:
      - clean.max_repeat
    outs:
      - data/silver/reviews.parquet
    metrics:
      # Pequeno e legível: vai para o Git, não para o cache do DVC.
      - reports/metrics/cleaning.json:
          cache: false

  split:
    cmd: >-
      python -m nano_review.data.split
      --input data/silver/reviews.parquet
      --output-dir data/gold
      --metrics reports/metrics/split.json
      --validation-fraction ${split.validation_fraction}
      --test-fraction ${split.test_fraction}
      --seed ${split.seed}
    deps:
      - src/nano_review/data/split.py
      - data/silver/reviews.parquet
    params:
      - split.validation_fraction
      - split.test_fraction
      - split.seed
    outs:
      - data/gold/train.parquet
      - data/gold/validation.parquet
      - data/gold/test.parquet
    metrics:
      - reports/metrics/split.json:
          cache: false

  judge:
    # Só train e validation: o juiz nunca vê o teste, que é aberto uma vez só, na Etapa 4.
    cmd: >-
      python -m nano_review.baseline.judge
      --train data/gold/train.parquet
      --validation data/gold/validation.parquet
      --model models/judge.joblib
      --metrics reports/metrics/judge.json
      --ngram-max ${judge.ngram_max}
      --min-df ${judge.min_df}
      --c ${judge.c}
    deps:
      - src/nano_review/baseline/judge.py
      # O juiz usa a chave de dedupe para reconhecer texto vazio.
      - src/nano_review/data/clean.py
      - data/gold/train.parquet
      - data/gold/validation.parquet
    params:
      - judge.ngram_max
      - judge.min_df
      - judge.c
    outs:
      - models/judge.joblib
    metrics:
      - reports/metrics/judge.json:
          cache: false

  baseline:
    cmd: >-
      python -m nano_review.baseline.evaluate
      --train data/gold/train.parquet
      --validation data/gold/validation.parquet
      --judge models/judge.joblib
      --metrics reports/metrics/baseline.json
      --samples reports/samples/baseline.jsonl
      --raw data/raw/B2W-Reviews01.csv
      --max-repeat ${clean.max_repeat}
      --vocab-min-count ${baseline.vocab_min_count}
      --tuning-fraction ${baseline.tuning_fraction}
      --samples-per-rating ${baseline.samples_per_rating}
      --max-tokens ${baseline.max_tokens}
      --seed ${baseline.seed}
    deps:
      - src/nano_review/baseline/evaluate.py
      - src/nano_review/baseline/ngram.py
      - src/nano_review/baseline/judge.py
      - src/nano_review/evaluation/metrics.py
      - src/nano_review/data/clean.py
      - data/gold/train.parquet
      - data/gold/validation.parquet
      - models/judge.joblib
      # Só para a referência humana de cópia antes do dedupe; as linhas do teste são descartadas.
      - data/raw/B2W-Reviews01.csv
    params:
      - baseline
      - clean.max_repeat
    outs:
      # Amostras pequenas e legíveis: vão para o Git, para a rubrica e a análise de erros.
      - reports/samples/baseline.jsonl:
          cache: false
    metrics:
      - reports/metrics/baseline.json:
          cache: false

  tokenizer:
    # Treinado só no train; a validação entra apenas para medir o comportamento dele.
    cmd: >-
      python -m nano_review.tokenization.bpe
      --train data/gold/train.parquet
      --validation data/gold/validation.parquet
      --output models/tokenizer.json
      --metrics reports/metrics/tokenizer.json
      --vocab-size ${tokenizer.vocab_size}
    deps:
      - src/nano_review/tokenization/bpe.py
      # Define os nomes dos tokens especiais (<bos>, <eos>, <unk>, <nota_k>).
      - src/nano_review/baseline/ngram.py
      - data/gold/train.parquet
      - data/gold/validation.parquet
    params:
      - tokenizer.vocab_size
    outs:
      - models/tokenizer.json
    metrics:
      - reports/metrics/tokenizer.json:
          cache: false

  train:
    cmd: >-
      python -m nano_review.training.train
      --train data/gold/train.parquet
      --validation data/gold/validation.parquet
      --tokenizer models/tokenizer.json
      --checkpoint models/transformer.pt
      --metrics reports/metrics/train.json
      --log reports/metrics/train_log.csv
      --figure reports/figures/train_curve.png
      --samples reports/samples/transformer_first.jsonl
      --block-size ${train.block_size}
      --d-model ${train.d_model}
      --n-layers ${train.n_layers}
      --n-heads ${train.n_heads}
      --dropout ${train.dropout}
      --batch-size ${train.batch_size}
      --learning-rate ${train.learning_rate}
      --weight-decay ${train.weight_decay}
      --warmup-steps ${train.warmup_steps}
      --max-steps ${train.max_steps}
      --eval-every ${train.eval_every}
      --eval-reviews ${train.eval_reviews}
      --patience ${train.patience}
      --samples-per-rating ${train.samples_per_rating}
      --seed ${train.seed}
      --conditioning ${train.conditioning}
    deps:
      - src/nano_review/training/train.py
      - src/nano_review/models/transformer.py
      - src/nano_review/models/loss.py
      - src/nano_review/data/dataset.py
      - src/nano_review/tokenization/bpe.py
      - src/nano_review/baseline/ngram.py
      - src/nano_review/reproducibility.py
      - models/tokenizer.json
      - data/gold/train.parquet
      - data/gold/validation.parquet
    params:
      - train
    outs:
      - models/transformer.pt
      - reports/figures/train_curve.png:
          cache: false
      - reports/samples/transformer_first.jsonl:
          cache: false
    metrics:
      - reports/metrics/train.json:
          cache: false
    plots:
      - reports/metrics/train_log.csv:
          cache: false

  evaluate:
    # A régua do charter (H1 a H6) na validação inteira; o teste só é aberto na Etapa 4.
    cmd: >-
      python -m nano_review.evaluation.transformer_eval
      --checkpoint models/transformer.pt
      --tokenizer models/tokenizer.json
      --judge models/judge.joblib
      --train data/gold/train.parquet
      --validation data/gold/validation.parquet
      --baseline reports/metrics/baseline.json
      --train-metrics reports/metrics/train.json
      --metrics reports/metrics/transformer_eval.json
      --samples reports/samples/transformer_eval.jsonl
      --samples-per-rating ${evaluate.samples_per_rating}
      --stride ${evaluate.stride}
      --seed ${evaluate.seed}
    deps:
      - src/nano_review/evaluation/transformer_eval.py
      - src/nano_review/evaluation/metrics.py
      - src/nano_review/baseline/evaluate.py
      - src/nano_review/baseline/judge.py
      - src/nano_review/baseline/ngram.py
      - src/nano_review/models/transformer.py
      - src/nano_review/tokenization/bpe.py
      - src/nano_review/data/clean.py
      - src/nano_review/reproducibility.py
      - models/transformer.pt
      - models/tokenizer.json
      - models/judge.joblib
      - data/gold/train.parquet
      - data/gold/validation.parquet
      - reports/metrics/baseline.json
      # Só para achar o run do MLflow do treino e gravar a avaliação nele.
      - reports/metrics/train.json
      - src/nano_review/training/train.py
    params:
      - evaluate
    outs:
      - reports/samples/transformer_eval.jsonl:
          cache: false
    metrics:
      - reports/metrics/transformer_eval.json:
          cache: false

  decoding:
    # Etapa 4.1: escolhe temperatura e top-k pela regra de docs/inference.md. Não lê validação
    # nem teste: as amostras são geradas, e a cópia e o vocabulário vêm do treino.
    cmd: >-
      python -m nano_review.evaluation.decoding
      --checkpoint models/transformer.pt
      --tokenizer models/tokenizer.json
      --judge models/judge.joblib
      --train data/gold/train.parquet
      --metrics reports/metrics/decoding.json
      --samples reports/samples/decoding.jsonl
      ${decoding}
    deps:
      - src/nano_review/evaluation/decoding.py
      - src/nano_review/evaluation/error_analysis.py
      - src/nano_review/evaluation/transformer_eval.py
      - src/nano_review/evaluation/metrics.py
      - src/nano_review/inference/sampling.py
      - src/nano_review/baseline/evaluate.py
      - src/nano_review/baseline/judge.py
      - src/nano_review/baseline/ngram.py
      - src/nano_review/data/clean.py
      - src/nano_review/models/transformer.py
      - src/nano_review/tokenization/bpe.py
      - models/transformer.pt
      - models/tokenizer.json
      - models/judge.joblib
      - data/gold/train.parquet
    params:
      - decoding
    outs:
      - reports/samples/decoding.jsonl:
          cache: false
    metrics:
      - reports/metrics/decoding.json:
          cache: false

  inference_check:
    # Etapa 4.2: o que a API entrega, com a decodificação padrão e os filtros do gerador. As
    # resenhas viram o conjunto do lote humano v2. Não lê validação nem teste.
    cmd: >-
      python -m nano_review.evaluation.inference_check
      --checkpoint models/transformer.pt
      --tokenizer models/tokenizer.json
      --judge models/judge.joblib
      --train data/gold/train.parquet
      --metrics reports/metrics/inference.json
      --samples reports/samples/inference.jsonl
      ${inference_check}
    deps:
      - src/nano_review/evaluation/inference_check.py
      - src/nano_review/evaluation/decoding.py
      - src/nano_review/evaluation/error_analysis.py
      - src/nano_review/evaluation/transformer_eval.py
      - src/nano_review/evaluation/metrics.py
      - src/nano_review/inference/generator.py
      - src/nano_review/inference/sampling.py
      - src/nano_review/baseline/evaluate.py
      - src/nano_review/baseline/judge.py
      - src/nano_review/baseline/ngram.py
      - src/nano_review/data/clean.py
      - src/nano_review/models/transformer.py
      - src/nano_review/tokenization/bpe.py
      - models/transformer.pt
      - models/tokenizer.json
      - models/judge.joblib
      - data/gold/train.parquet
    params:
      - inference_check
    outs:
      - reports/samples/inference.jsonl:
          cache: false
    metrics:
      - reports/metrics/inference.json:
          cache: false

  final_eval:
    # Etapa 4.3: o ÚNICO estágio que lê data/gold/test.parquet. Rodou uma vez (20/11/2026,
    # commit 0ea7148) e está congelado: `frozen: true` faz o `dvc repro` pular o estágio, mesmo se
    # uma dependência mudar (docs/final_test.md). O `dvc freeze` não reescreve estágios com
    # ${...}, por isso o campo foi escrito à mão. Antes de ler o teste, o estágio confere na
    # validação as perplexities já conhecidas e para com erro se não baterem.
    frozen: true
    cmd: >-
      python -m nano_review.evaluation.final_eval
      --checkpoint models/transformer.pt
      --tokenizer models/tokenizer.json
      --judge models/judge.joblib
      --train data/gold/train.parquet
      --validation data/gold/validation.parquet
      --test data/gold/test.parquet
      --raw data/raw/B2W-Reviews01.csv
      --baseline reports/metrics/baseline.json
      --transformer-eval reports/metrics/transformer_eval.json
      --metrics reports/metrics/final_eval.json
      --samples reports/samples/final_eval.jsonl
      --control reports/samples/test_real_control.jsonl
      --stride ${evaluate.stride}
      --max-repeat ${clean.max_repeat}
      --vocab-min-count ${baseline.vocab_min_count}
      ${final_eval}
    deps:
      - src/nano_review/evaluation/final_eval.py
      - src/nano_review/evaluation/inference_check.py
      - src/nano_review/evaluation/decoding.py
      - src/nano_review/evaluation/error_analysis.py
      - src/nano_review/evaluation/transformer_eval.py
      - src/nano_review/evaluation/metrics.py
      - src/nano_review/inference/generator.py
      - src/nano_review/inference/sampling.py
      - src/nano_review/baseline/evaluate.py
      - src/nano_review/baseline/judge.py
      - src/nano_review/baseline/ngram.py
      - src/nano_review/data/clean.py
      - src/nano_review/models/transformer.py
      - src/nano_review/tokenization/bpe.py
      - models/transformer.pt
      - models/tokenizer.json
      - models/judge.joblib
      - data/gold/train.parquet
      - data/gold/validation.parquet
      - data/gold/test.parquet
      - data/raw/B2W-Reviews01.csv
      - reports/metrics/baseline.json
      - reports/metrics/transformer_eval.json
    params:
      - final_eval
      - evaluate.stride
      - clean.max_repeat
      - baseline.vocab_min_count
    outs:
      - reports/samples/final_eval.jsonl:
          cache: false
      - reports/samples/test_real_control.jsonl:
          cache: false
    metrics:
      - reports/metrics/final_eval.json:
          cache: false

# `dvc plots show` desenha a curva de treino e validação direto do CSV do estágio train.
plots:
  - curva_de_treino:
      x: step
      y:
        reports/metrics/train_log.csv: [train_loss, val_loss]
