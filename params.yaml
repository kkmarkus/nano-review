# Parâmetros do pipeline, dos dados ao treino. O DVC lê este arquivo: mudar um valor aqui faz o
# `dvc repro` refazer só os estágios que dependem dele.

clean:
  # Uma letra repetida mais vezes que isso é cortada ("muuuuuito" -> "muuuito").
  max_repeat: 3

split:
  # Frações de resenhas (não de produtos); o treino fica com o resto (80%).
  validation_fraction: 0.1
  test_fraction: 0.1
  seed: 42

judge:
  # TF-IDF com unigramas e bigramas; termos em menos de min_df resenhas são descartados.
  ngram_max: 2
  min_df: 2
  # Inverso da regularização da regressão logística (valor padrão do scikit-learn, sem ajuste:
  # ajustar o juiz olhando a validação deixaria a medida dele otimista).
  c: 1.0

baseline:
  # Palavras com menos ocorrências que isso no treino viram <unk>.
  vocab_min_count: 2
  # Fatia do treino (por produto) usada só para escolher os pesos λ do trigrama.
  tuning_fraction: 0.1
  # Amostras geradas por nota; resenhas reais da validação na mesma quantidade, como referência.
  samples_per_rating: 200
  max_tokens: 100
  seed: 42

tokenizer:
  # Tamanho do vocabulário BPE, contando os 9 tokens especiais. É um dos experimentos da Etapa 3.
  vocab_size: 4000

train:
  # Contexto máximo (posições de entrada); resenhas maiores saem do treino (2,4%, decidido na 2.1).
  block_size: 128
  # Modelo pequeno para CPU: ~1,3 milhão de parâmetros.
  d_model: 128
  n_layers: 4
  n_heads: 4
  dropout: 0.1
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 200
  # Primeiro treino curto (~2 épocas, ~13 min em CPU). Treinos maiores são experimentos da Etapa 3.
  max_steps: 6000
  eval_every: 250
  # Amostra fixa da validação usada durante o treino; o melhor modelo é medido na validação inteira.
  eval_reviews: 3000
  samples_per_rating: 3
  seed: 42
