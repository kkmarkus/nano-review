# Parâmetros do pipeline, dos dados ao treino. O DVC lê este arquivo: mudar um valor aqui faz o
# `dvc repro` refazer só os estágios que dependem dele.

clean:
  # Uma letra repetida mais vezes que isso é cortada ("muuuuuito" -> "muuuito").
  max_repeat: 3

split:
  # Frações de resenhas (não de produtos); o treino fica com o resto (80%).
  validation_fraction: 0.1
  test_fraction: 0.1
  seed: 42

judge:
  # TF-IDF com unigramas e bigramas; termos em menos de min_df resenhas são descartados.
  ngram_max: 2
  min_df: 2
  # Inverso da regularização da regressão logística (valor padrão do scikit-learn, sem ajuste:
  # ajustar o juiz olhando a validação deixaria a medida dele otimista).
  c: 1.0

baseline:
  # Palavras com menos ocorrências que isso no treino viram <unk>.
  vocab_min_count: 2
  # Fatia do treino (por produto) usada só para escolher os pesos λ do trigrama.
  tuning_fraction: 0.1
  # Amostras geradas por nota; resenhas reais da validação na mesma quantidade, como referência.
  samples_per_rating: 200
  max_tokens: 100
  seed: 42

tokenizer:
  # Tamanho do vocabulário BPE, contando os 9 tokens especiais. É um dos experimentos da Etapa 3.
  vocab_size: 8000

train:
  # Contexto máximo (posições de entrada); resenhas maiores saem do treino (decidido na 2.1). Com o
  # vocabulário de 8.000, saem 1,8% (reports/metrics/train.json).
  block_size: 128
  # Configuração final da Etapa 3 (E2 + E3 + E4 + E5): ~5,2 milhões de parâmetros, pequeno para CPU.
  d_model: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.0
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.1
  warmup_steps: 200
  # Run final da Etapa 3: 15.000 passos, ~66 min em CPU. O primeiro treino (Etapa 2) tinha 6.000.
  max_steps: 15000
  eval_every: 250
  # Amostra fixa da validação usada durante o treino; o melhor modelo é medido na validação inteira.
  eval_reviews: 3000
  # Early stopping: para depois de tantas avaliações seguidas sem melhorar a validação (0 desliga).
  # Com eval_every 250, 8 avaliações = 2.000 passos sem ganho.
  patience: 8
  samples_per_rating: 3
  seed: 42
  # Com ou sem o token <nota_k> no começo da sequência. false só na ablação E6.
  conditioning: true

evaluate:
  # Amostras por nota, sorteadas com temperatura 1 e sem top-k: a mesma régua do trigrama.
  samples_per_rating: 200
  # Resenhas maiores que o block_size são pontuadas em janelas; cada nova janela pontua até
  # `stride` tokens, vendo pelo menos block_size - 2 - stride tokens de contexto antes deles.
  stride: 64
  seed: 42

decoding:
  # Etapa 4.1: combinações varridas para escolher a decodificação. A regra de escolha está em
  # docs/inference.md e foi escrita antes de rodar. As chaves usam hífen porque o DVC transforma
  # a seção inteira nos argumentos do script (--temperatures 1.0 0.9 ... --top-ks 0 50 20 ...).
  temperatures: [1.0, 0.9, 0.8, 0.7]
  # 0 quer dizer "sem top-k".
  top-ks: [0, 50, 20]
  samples-per-rating: 200
  seed: 42

inference_check:
  # Etapa 4.2: mede o pipeline completo do produto (decodificação + filtros) com a temperatura
  # padrão e cada top-k abaixo. Chaves com hífen pelo mesmo motivo da seção decoding.
  top-ks: [0, 50]
  samples-per-rating: 200
  seed: 42

final_eval:
  # Etapa 4.3: o teste final, rodado uma única vez (docs/final_test.md). Sementes nunca usadas
  # antes: a decodificação foi escolhida com a semente 42, e medir nela de novo seria otimista.
  # Chaves com hífen pelo mesmo motivo da seção decoding.
  samples-per-rating: 200
  seed: 2027
  # Resenhas reais do teste para o controle do lote humano v2.
  control-per-rating: 10
  control-seed: 2028
